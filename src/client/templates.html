<head>
  <title>HOPPA</title>

  <!-- mobile-first: lock the viewport, avoid double-tap zoom, respect notches -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="color-scheme" content="dark">

  <!-- PWA / installability -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- iOS standalone behaviour -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HOPPA">
</head>

<template name="ApplicationHome">
  <div class="hoppa" id="hoppa">
    <canvas class="hoppa__canvas" id="hoppa-canvas"></canvas>

    <div class="hoppa__hud">
      <span class="hoppa__score" id="hoppa-score">0</span>
      <div class="hoppa__right">
        <span class="hoppa__best" id="hoppa-best">best 0</span>
        <span class="hoppa__air" id="hoppa-air">jumps x1</span>
      </div>
    </div>
    <div class="hoppa__fx" id="hoppa-fx"></div>

    <div class="hoppa__overlay" id="hoppa-overlay">
      <h1 class="hoppa__title">HOPPA</h1>
      <p class="hoppa__sub" id="hoppa-sub">a koad:io mobile rig</p>
      <p class="hoppa__cta" id="hoppa-cta">tap to start</p>

      <!-- arcade initials entry: three letter slots and an ENTER. Shown only
           when the run qualifies for the board. -->
      <div class="hoppa__entry" id="hoppa-entry" hidden>
        <p class="hoppa__entry-label">high score &mdash; enter initials</p>
        <div class="hoppa__slots">
          <div class="hoppa__slot">
            <button type="button" class="hoppa__arrow" data-slot="0" data-dir="1" aria-label="letter up">&#9650;</button>
            <span class="hoppa__letter" data-letter="0">A</span>
            <button type="button" class="hoppa__arrow" data-slot="0" data-dir="-1" aria-label="letter down">&#9660;</button>
          </div>
          <div class="hoppa__slot">
            <button type="button" class="hoppa__arrow" data-slot="1" data-dir="1" aria-label="letter up">&#9650;</button>
            <span class="hoppa__letter" data-letter="1">A</span>
            <button type="button" class="hoppa__arrow" data-slot="1" data-dir="-1" aria-label="letter down">&#9660;</button>
          </div>
          <div class="hoppa__slot">
            <button type="button" class="hoppa__arrow" data-slot="2" data-dir="1" aria-label="letter up">&#9650;</button>
            <span class="hoppa__letter" data-letter="2">A</span>
            <button type="button" class="hoppa__arrow" data-slot="2" data-dir="-1" aria-label="letter down">&#9660;</button>
          </div>
        </div>
        <button type="button" class="hoppa__enter" id="hoppa-enter">enter</button>
      </div>

      <!-- the board. Server-backed: all time, and the last 72 hours. -->
      <div class="hoppa__board" id="hoppa-board" hidden>
        <div class="hoppa__col">
          <h2 class="hoppa__col-title">all time</h2>
          <ol class="hoppa__list" id="hoppa-alltime"></ol>
        </div>
        <div class="hoppa__col">
          <h2 class="hoppa__col-title">last 72h</h2>
          <ol class="hoppa__list" id="hoppa-recent"></ol>
        </div>
      </div>

      <p class="hoppa__hint hoppa__hint--key">avoid the squares &middot; collect the circles</p>
      <p class="hoppa__hint">tap to hop &middot; hold for higher &middot; tap again in the air</p>
      <p class="hoppa__hint">tilt to steer &middot; points come only from airtime</p>
    </div>

    <!-- settings. The gear lives outside the overlay so it is reachable while the
         overlay is hidden, i.e. mid-run; opening it pauses the game. -->
    <button type="button" class="hoppa__gear" id="hoppa-gear" aria-label="settings">&#9881;</button>

    <div class="hoppa__settings" id="hoppa-settings" hidden>
      <div class="hoppa__panel">
        <h2 class="hoppa__panel-title">settings</h2>

        <div class="hoppa__field">
          <span class="hoppa__field-label">theme</span>
          <div class="hoppa__swatches" id="hoppa-themes"></div>
        </div>

        <div class="hoppa__field">
          <span class="hoppa__field-label">tilt sensitivity <em id="hoppa-sens-val">1.0x</em></span>
          <input type="range" class="hoppa__range" id="hoppa-sens" min="0.4" max="3" step="0.1" value="1">
        </div>

        <div class="hoppa__field">
          <span class="hoppa__field-label">put your face on the hoppa</span>
          <div class="hoppa__face">
            <div class="hoppa__face-preview" id="hoppa-face-preview"><span>&#9786;</span></div>
            <div class="hoppa__face-actions">
              <button type="button" class="hoppa__btn" id="hoppa-face-take">camera</button>
              <button type="button" class="hoppa__btn" id="hoppa-face-shot" hidden>capture</button>
              <button type="button" class="hoppa__btn" id="hoppa-face-clear" hidden>clear</button>
            </div>
          </div>
          <video class="hoppa__video" id="hoppa-video" playsinline muted hidden></video>
          <p class="hoppa__face-note" id="hoppa-face-note"></p>
        </div>

        <button type="button" class="hoppa__enter" id="hoppa-settings-close">done</button>
      </div>
    </div>
  </div>
</template>


<!-- Without a router, this is what mounts the app. A single route did not justify
     iron-router — and dropping it removes the last koad:io dependency, so the
     app now builds from stock Atmosphere packages alone. -->
<body>
  {{> ApplicationHome}}
</body>
